<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台灣毛孩生活調查 🐾</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FFF8F0;
      --cream2: #FFF3E4;
      --light: #FFE8CC;
      --orange: #FF8C42;
      --orange-dark: #E5722E;
      --yellow: #FFD166;
      --brown: #8B5E3C;
      --dark: #3D2B1F;
      --shadow: rgba(139,94,60,0.15);
      --white: #FFFFFF;
      --sage: #7DAA8A;
      --pink: #FF9B9B;
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      background: var(--cream);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 600px;
      min-height: 100vh;
      background: var(--cream);
      position: relative;
      overflow-x: hidden;
    }

    /* ===== SCREENS ===== */
    .screen { display: none; flex-direction: column; min-height: 100vh; }
    .screen.active { display: flex; }

    /* ===== WELCOME ===== */
    #scr-welcome {
      background: linear-gradient(155deg, #FFF0DC 0%, #FFD6A5 100%);
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      gap: 0;
    }

    .welcome-paw {
      font-size: 88px;
      animation: paw-bounce 2s ease-in-out infinite;
      margin-bottom: 24px;
    }

    @keyframes paw-bounce {
      0%,100% { transform: translateY(0) rotate(-8deg); }
      50% { transform: translateY(-18px) rotate(8deg); }
    }

    .welcome-title {
      font-size: 34px;
      font-weight: 900;
      color: var(--dark);
      line-height: 1.3;
      margin-bottom: 16px;
    }

    .welcome-subtitle {
      font-size: 15px;
      color: var(--brown);
      line-height: 1.8;
      margin-bottom: 36px;
      max-width: 340px;
    }

    .btn-primary {
      background: var(--orange);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 16px 48px;
      font-size: 18px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(255,140,66,0.45);
      transition: all .2s;
      margin-bottom: 16px;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(255,140,66,0.55); }
    .btn-primary:active { transform: translateY(0); }

    .welcome-note { font-size: 13px; color: var(--brown); opacity: 0.8; }

    /* ===== SURVEY ===== */
    #scr-survey { padding: 20px 20px 12px; }

    .progress-wrap { margin-bottom: 20px; }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--brown);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .progress-bar {
      height: 7px;
      background: var(--light);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--orange), var(--yellow));
      border-radius: 4px;
      transition: width .45s cubic-bezier(.4,.0,.2,1);
    }

    /* Question Card */
    .q-card {
      background: var(--white);
      border-radius: 24px;
      padding: 28px 22px 24px;
      box-shadow: 0 4px 28px var(--shadow);
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .q-emoji { font-size: 44px; margin-bottom: 14px; }

    .q-title {
      font-size: 21px;
      font-weight: 700;
      color: var(--dark);
      line-height: 1.4;
      margin-bottom: 6px;
    }

    .q-sub {
      font-size: 13px;
      color: var(--brown);
      margin-bottom: 24px;
      opacity: 0.85;
    }

    .opts { display: flex; flex-direction: column; gap: 11px; flex: 1; }

    .opt {
      background: var(--cream);
      border: 2.5px solid var(--light);
      border-radius: 16px;
      padding: 14px 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all .18s;
      text-align: left;
      font-family: inherit;
      width: 100%;
    }
    .opt:hover { border-color: var(--orange); background: #FFF4E6; }
    .opt.sel {
      border-color: var(--orange);
      background: linear-gradient(135deg, #FFF4E6, #FFE8CC);
      box-shadow: 0 3px 14px rgba(255,140,66,0.25);
    }

    .opt-ico { font-size: 28px; min-width: 36px; text-align: center; }

    .opt-label { font-size: 15px; font-weight: 600; color: var(--dark); display: block; }
    .opt-desc { font-size: 12px; color: var(--brown); margin-top: 2px; }

    /* Breed grid */
    .breed-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      flex: 1;
      overflow-y: auto;
      max-height: 55vh;
      padding-right: 2px;
    }

    .breed-btn {
      background: var(--cream);
      border: 2.5px solid var(--light);
      border-radius: 14px;
      padding: 14px 8px 12px;
      cursor: pointer;
      text-align: center;
      transition: all .18s;
      font-family: inherit;
    }
    .breed-btn:hover { border-color: var(--orange); background: #FFF4E6; }
    .breed-btn.sel {
      border-color: var(--orange);
      background: linear-gradient(135deg, #FFF4E6, #FFE8CC);
      box-shadow: 0 3px 10px rgba(255,140,66,0.25);
    }
    .breed-ico { font-size: 30px; display: block; margin-bottom: 6px; }
    .breed-name { font-size: 13px; font-weight: 600; color: var(--dark); line-height: 1.3; }

    /* Nav */
    .nav-row { display: flex; gap: 12px; padding-top: 18px; }

    .btn-back {
      background: var(--white);
      border: 2px solid var(--light);
      border-radius: 50px;
      padding: 13px 22px;
      font-size: 15px;
      font-weight: 600;
      color: var(--brown);
      cursor: pointer;
      font-family: inherit;
      transition: all .18s;
    }
    .btn-back:hover { border-color: var(--orange); color: var(--orange); }

    .btn-next {
      background: var(--orange);
      border: none;
      border-radius: 50px;
      padding: 13px;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      font-family: inherit;
      flex: 1;
      transition: all .18s;
      box-shadow: 0 4px 16px rgba(255,140,66,0.35);
    }
    .btn-next:disabled { background: #d0c8c0; box-shadow: none; cursor: not-allowed; }
    .btn-next:not(:disabled):hover { background: var(--orange-dark); }

    /* ===== LOADING ===== */
    #scr-loading {
      background: linear-gradient(155deg, #FFE8CC, #FFD6A5);
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 20px;
    }
    .loading-paw { font-size: 80px; animation: spin-paw 1.2s ease-in-out infinite; }
    @keyframes spin-paw {
      0%,100% { transform: scale(1) rotate(-10deg); }
      50% { transform: scale(1.15) rotate(10deg); }
    }
    .loading-title { font-size: 22px; font-weight: 700; color: var(--dark); }
    .loading-sub { font-size: 14px; color: var(--brown); }
    .loading-dots span {
      display: inline-block;
      width: 8px; height: 8px;
      background: var(--orange);
      border-radius: 50%;
      margin: 0 3px;
      animation: dot-bounce 1.2s ease-in-out infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: .2s; }
    .loading-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes dot-bounce {
      0%,100% { transform: translateY(0); opacity: .4; }
      50% { transform: translateY(-10px); opacity: 1; }
    }

    /* ===== RESULT ===== */
    #scr-result {
      background: linear-gradient(155deg, #FFF0DC 0%, #FFD6A5 100%);
      align-items: center;
      padding: 28px 20px 52px;
      gap: 16px;
      overflow-y: auto;
    }

    /* 品種平均統計卡 */
    .breed-stats-card {
      background: var(--white);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 3px 20px var(--shadow);
      width: 100%;
      max-width: 300px;
    }
    .breed-stats-title {
      font-size: 15px; font-weight: 700; color: var(--dark);
      text-align: center; margin-bottom: 3px;
    }
    .breed-stats-sub {
      font-size: 12px; color: var(--brown);
      text-align: center; margin-bottom: 14px; opacity: .8;
    }
    .stat-row { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
    .stat-label { font-size: 12px; font-weight: 600; color: var(--dark); min-width: 58px; }
    .stat-bar-wrap { flex: 1; height: 13px; background: var(--light); border-radius: 7px; overflow: hidden; }
    .stat-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--orange), var(--yellow));
      border-radius: 7px;
      width: 0;
      transition: width 0.9s cubic-bezier(.4,.0,.2,1);
    }
    .stat-val { font-size: 12px; font-weight: 700; color: var(--brown); min-width: 22px; text-align: right; }
    .breed-top-mbti {
      margin-top: 12px; padding: 10px 14px;
      background: var(--cream); border-radius: 12px;
      font-size: 13px; color: var(--brown); text-align: center; line-height: 1.5;
    }
    .breed-stats-loading {
      text-align: center; padding: 20px 0;
      font-size: 13px; color: var(--brown);
    }

    .result-top { text-align: center; }
    .result-heading { font-size: 14px; color: var(--brown); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
    .result-title { font-size: 26px; font-weight: 900; color: var(--dark); }

    /* Card Flip */
    .card-scene {
      width: 300px;
      height: 420px;
      perspective: 1000px;
    }

    .flip-card {
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform .9s cubic-bezier(.4,.2,.2,1);
      position: relative;
      cursor: pointer;
    }

    .flip-card.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 24px;
    }

    .card-front {
      background: linear-gradient(135deg, #FF8C42 0%, #FFD166 100%);
      box-shadow: 0 10px 40px rgba(255,140,66,0.4);
    }
    .front-icon { font-size: 72px; animation: float 3s ease-in-out infinite; margin-bottom: 16px; }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .front-hint { font-size: 16px; font-weight: 700; color: rgba(255,255,255,0.9); }
    .front-hint-sub { font-size: 13px; color: rgba(255,255,255,0.7); margin-top: 6px; }

    .card-back {
      background: linear-gradient(135deg, #FFF8F0 0%, #FFE8CC 100%);
      border: 3px solid var(--orange);
      box-shadow: 0 10px 40px rgba(255,140,66,0.35);
      transform: rotateY(180deg);
      text-align: center;
    }

    .back-breed-emoji { font-size: 52px; margin-bottom: 8px; }
    .back-mbti { font-size: 42px; font-weight: 900; color: var(--orange); letter-spacing: 5px; }
    .back-name { font-size: 19px; font-weight: 700; color: var(--dark); margin: 6px 0 4px; }
    .back-tagline { font-size: 12px; color: var(--brown); font-weight: 500; margin-bottom: 12px; opacity: .85; }
    .back-desc { font-size: 12.5px; color: var(--brown); line-height: 1.7; margin-bottom: 14px; }
    .back-traits { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; }
    .trait-tag {
      background: var(--orange);
      color: #fff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .result-actions { display: flex; gap: 12px; width: 100%; max-width: 300px; }

    .btn-outline {
      flex: 1;
      background: var(--white);
      border: 2px solid var(--orange);
      border-radius: 50px;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      color: var(--orange);
      cursor: pointer;
      font-family: inherit;
      transition: all .18s;
    }
    .btn-outline:hover { background: #FFF4E6; }

    .btn-ranking {
      flex: 1;
      background: var(--orange);
      border: none;
      border-radius: 50px;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 4px 14px rgba(255,140,66,0.4);
      transition: all .18s;
    }
    .btn-ranking:hover { background: var(--orange-dark); }

    .flip-hint { font-size: 12px; color: var(--brown); opacity: .7; }

    /* Dimension bars */
    .dim-bars { width: 100%; max-width: 300px; }
    .dim-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; }
    .dim-lbl { min-width: 28px; font-weight: 700; color: var(--orange); }
    .dim-bar-wrap { flex: 1; height: 10px; background: #FFE8CC; border-radius: 5px; overflow: hidden; }
    .dim-bar-fill { height: 100%; background: linear-gradient(90deg, var(--orange), var(--yellow)); border-radius: 5px; }
    .dim-rgt { min-width: 28px; font-weight: 700; color: var(--brown); text-align: right; }

    /* ===== RANKINGS ===== */
    #scr-rankings { padding: 0 0 40px; }

    .rank-header {
      background: linear-gradient(135deg, var(--orange), var(--yellow));
      padding: 32px 24px 28px;
      text-align: center;
      color: white;
    }
    .rank-header-title { font-size: 26px; font-weight: 900; margin-bottom: 6px; }
    .rank-header-sub { font-size: 14px; opacity: .85; }

    .rank-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 14px 20px 0;
    }

    .rank-tab {
      background: var(--white);
      border: 2px solid var(--light);
      border-radius: 50px;
      padding: 7px 14px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--brown);
      cursor: pointer;
      white-space: nowrap;
      transition: all .18s;
      font-family: inherit;
    }
    .rank-tab.active {
      background: var(--orange);
      border-color: var(--orange);
      color: #fff;
      box-shadow: 0 3px 12px rgba(255,140,66,0.35);
    }

    .rank-content { padding: 16px 20px; }

    /* 品種個性 accordion */
    .breed-list { display: flex; flex-direction: column; gap: 8px; }

    .breed-acc-item {
      border: 2px solid var(--light);
      border-radius: 14px;
      overflow: hidden;
      transition: border-color .2s;
      background: var(--cream);
    }
    .breed-acc-item.open { border-color: var(--orange); background: #FFF8F2; }

    .breed-acc-header {
      display: flex;
      align-items: center;
      padding: 11px 14px;
      cursor: pointer;
      gap: 9px;
      user-select: none;
    }
    .breed-acc-emoji { font-size: 22px; }
    .breed-acc-name  { font-size: 14px; font-weight: 700; color: var(--dark); flex: 1; }
    .breed-acc-count { font-size: 12px; color: var(--brown); background: var(--light); padding: 2px 8px; border-radius: 20px; }
    .breed-acc-arrow { font-size: 10px; color: var(--orange); transition: transform .25s; }
    .breed-acc-item.open .breed-acc-arrow { transform: rotate(180deg); }

    .breed-acc-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height .35s ease;
    }
    .breed-acc-item.open .breed-acc-body { max-height: 380px; }
    .breed-acc-inner { padding: 0 14px 14px; border-top: 1px solid var(--light); padding-top: 12px; }

    .rank-section { display: none; }
    .rank-section.active { display: block; }

    .rank-card {
      background: var(--white);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 3px 20px var(--shadow);
      margin-bottom: 14px;
    }

    .rank-card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .rank-item { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .rank-pos { font-size: 14px; font-weight: 900; color: var(--orange); min-width: 20px; }
    .rank-pos.gold { color: #F5A623; }
    .rank-pos.silver { color: #9B9B9B; }
    .rank-pos.bronze { color: #C47E2A; }

    .rank-breed-info { min-width: 90px; }
    .rank-breed-name { font-size: 13px; font-weight: 600; color: var(--dark); }
    .rank-breed-sub { font-size: 11px; color: var(--brown); }

    .rank-bar-wrap { flex: 1; height: 18px; background: var(--light); border-radius: 9px; overflow: hidden; }
    .rank-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--orange), var(--yellow));
      border-radius: 9px;
      transition: width 1s cubic-bezier(.4,.0,.2,1);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 6px;
    }
    .rank-bar-val { font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.9); white-space: nowrap; }

    .rank-score { font-size: 13px; font-weight: 700; color: var(--brown); min-width: 32px; text-align: right; }

    /* MBTI distribution */
    .mbti-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .mbti-dist-item {
      background: var(--cream);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .mbti-dist-type { font-size: 16px; font-weight: 900; color: var(--orange); min-width: 52px; }
    .mbti-dist-bar-wrap { flex: 1; height: 8px; background: var(--light); border-radius: 4px; overflow: hidden; }
    .mbti-dist-bar { height: 100%; background: var(--orange); border-radius: 4px; }
    .mbti-dist-pct { font-size: 12px; font-weight: 700; color: var(--brown); }

    .rank-back-btn {
      margin: 12px 20px 0;
      background: var(--white);
      border: 2px solid var(--light);
      border-radius: 50px;
      padding: 13px;
      font-size: 15px;
      font-weight: 700;
      color: var(--brown);
      cursor: pointer;
      font-family: inherit;
      width: calc(100% - 40px);
      transition: all .18s;
    }
    .rank-back-btn:hover { border-color: var(--orange); color: var(--orange); }

    /* Transitions */
    @keyframes slideInR { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes slideInL { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .anim-in-r { animation: slideInR .28s ease; }
    .anim-in-l { animation: slideInL .28s ease; }

    /* ===== FLIP EFFECTS ===== */

    /* 關燈遮罩 */
    #dim-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0);
      z-index: 9990;
      pointer-events: all;
      transition: background 0.38s ease;
    }
    #dim-overlay.lights-off { background: rgba(0,0,0,0.93); }

    /* 星星粒子 */
    .sparkle-p {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%,-50%) scale(0);
      animation: sparkle-burst var(--dur) ease-out var(--delay) forwards;
    }
    @keyframes sparkle-burst {
      0%   { transform: translate(-50%,-50%) scale(0) rotate(0deg); opacity: 1; }
      55%  { opacity: 1; }
      100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.1) rotate(var(--rot)); opacity: 0; }
    }

    /* 卡片光澤掃過 */
    .card-shimmer {
      position: absolute; inset: 0;
      border-radius: 22px;
      pointer-events: none;
      z-index: 2;
      background: linear-gradient(108deg,
        transparent 25%,
        rgba(255,255,255,0.55) 50%,
        transparent 75%
      );
      background-size: 250% 100%;
      background-position: 250% 0;
      animation: shimmer-sweep 0.75s ease-out 0.05s forwards;
    }
    @keyframes shimmer-sweep {
      from { background-position: 250% 0; }
      to   { background-position: -250% 0; }
    }

    /* 翻卡片時卡片場景發光暈 */
    .card-scene.glow {
      filter: drop-shadow(0 0 18px rgba(255,220,100,0.7));
      transition: filter 0.5s ease;
    }

    @media (max-width: 420px) {
      .welcome-title { font-size: 28px; }
      .card-scene { width: 270px; height: 380px; }
      .back-mbti { font-size: 36px; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- WELCOME -->
  <div id="scr-welcome" class="screen active">
    <div class="welcome-paw">🐾</div>
    <h1 class="welcome-title">台灣毛孩<br>生活大調查</h1>
    <p class="welcome-subtitle">
      每隻狗狗都是獨一無二的！<br>
      用 13 道題找出你毛孩的<br>
      <strong>MBTI 人格類型</strong>，<br>
      還能看看台灣各品種狗狗的排行榜 📊
    </p>
    <button class="btn-primary" onclick="startSurvey()">開始填問卷 🐶</button>
    <p class="welcome-note">共 13 題，約 3 分鐘完成</p>
  </div>

  <!-- SURVEY -->
  <div id="scr-survey" class="screen">
    <div class="progress-wrap">

// ==================== NAVIGATION ====================

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => {
    s.classList.remove('active');
    s.style.display = '';
  });
  const el = document.getElementById(id);
  el.classList.add('active');
  el.style.display = 'flex';
  window.scrollTo(0,0);
}

function startSurvey() {
  state.page = 0;
  state.answers = {};
  showScreen('scr-survey');
  renderQuestion();
}

function goBack() {
  if (state.page <= 0) { showScreen('scr-welcome'); return; }
  // skip breed if going back past it when no size is set
  state.page--;
  if (QUESTIONS[state.page].id === 'breed' && !state.answers.size) {
    state.page--;
  }
  renderQuestion(true);
}

function goNext() {
  const q = QUESTIONS[state.page];
  if (!state.answers[q.id]) return;

  // If just answered size, reset breed answer
  if (q.id === 'size') {
    delete state.answers.breed;
  }

  state.page++;
  if (state.page >= QUESTIONS.length) {
    submitSurvey();
    return;
  }
  renderQuestion();
}

function renderQuestion(back = false) {
  const q = QUESTIONS[state.page];
  const total = QUESTIONS.length;
  const frac = state.page + 1;

  document.getElementById('pg-label').textContent = `第 ${frac} 題`;
  document.getElementById('pg-frac').textContent = `${frac} / ${total}`;
  document.getElementById('pg-fill').style.width = `${Math.round(frac / total * 100)}%`;

  document.getElementById('btn-back').style.display = state.page === 0 ? 'none' : '';
  document.getElementById('btn-next').disabled = !state.answers[q.id];

  const nextBtn = document.getElementById('btn-next');
  nextBtn.textContent = state.page === QUESTIONS.length - 1 ? '查看結果 🐾' : '下一題 →';

  const container = document.getElementById('q-container');
  container.innerHTML = '';

  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;flex-direction:column;flex:1;';
  wrap.classList.add(back ? 'anim-in-l' : 'anim-in-r');

  if (q.type === 'breed') {
    wrap.innerHTML = buildBreedHTML(q);
  } else {
    wrap.innerHTML = buildSingleHTML(q);
  }

  container.appendChild(wrap);

  // attach events
  if (q.type === 'breed') {
    wrap.querySelectorAll('.breed-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        wrap.querySelectorAll('.breed-btn').forEach(b => b.classList.remove('sel'));
        btn.classList.add('sel');
        state.answers[q.id] = btn.dataset.v;
        state.breedData = JSON.parse(btn.dataset.info);
        document.getElementById('btn-next').disabled = false;
      });
    });
  } else {
    wrap.querySelectorAll('.opt').forEach(btn => {
      btn.addEventListener('click', () => {
        wrap.querySelectorAll('.opt').forEach(b => b.classList.remove('sel'));
        btn.classList.add('sel');
        state.answers[q.id] = btn.dataset.v;
        document.getElementById('btn-next').disabled = false;
      });
    });
  }

  // restore selection
  if (state.answers[q.id]) {
    const existing = wrap.querySelector(`[data-v="${state.answers[q.id]}"]`);
    if (existing) existing.classList.add(q.type === 'breed' ? 'sel' : 'sel');
  }
}

function buildSingleHTML(q) {
  const selV = state.answers[q.id];
  const opts = q.opts.map(o => `
    <button class="opt${selV === o.v ? ' sel' : ''}" data-v="${o.v}">

function buildBreedHTML(q) {

    <div class="breed-grid">${btns}</div>

}

// ==================== MBTI CALCULATION ====================

function calcMBTI(ans) {
  // E/I: stranger + separation
  const strangerScore = { hide:-2, ignore:-1, wag:1, jump:2 };
  const sepScore      = { ok:-1, bark_lil:0, dramatic:2 };
  const EI = (strangerScore[ans.stranger] || 0) + (sepScore[ans.separation] || 0);

  // S/N: exercise level
  const exScore = { none:-2, pee:-1, walk:1, run:2 };
  const SN = exScore[ans.exercise] || 0;

  // T/F: food appetite
  const foodScore = { picky:-2, normal:-1, hungry:1, vacuum:2 };
  const TF = foodScore[ans.food] || 0;

  // J/P: vocal level
  const vocalScore = { silent:-2, rarely:-1, moderate:1, loud:2 };
  const JP = vocalScore[ans.vocal] || 0;

  return {
    type: `${EI>0?'E':'I'}${SN>0?'S':'N'}${TF>0?'F':'T'}${JP>0?'J':'P'}`,
    scores: { EI, SN, TF, JP }
  };
}

// ==================== STORAGE (localStorage → 之後換 Firestore) ====================

async function saveSubmission(data) {
  try {
    await db.collection('dog_surveys').add(data);
  } catch (e) {
    console.warn('Firebase 寫入失敗，備用 localStorage', e);
    const local = JSON.parse(localStorage.getItem('dog_survey') || '[]');
    local.push(data);
    localStorage.setItem('dog_survey', JSON.stringify(local));
  }
}

async function loadSubmissions() {
  try {
    const snap = await db.collection('dog_surveys').get();
    return snap.docs.map(d => d.data());
  } catch (e) {
    console.warn('Firebase 讀取失敗，備用 localStorage', e);
    return JSON.parse(localStorage.getItem('dog_survey') || '[]');
  }
}

  const payload = {

let _flipping = false;

function flipCard() {
  if (_flipping) return;
  _flipping = true;

  const card   = document.getElementById('flip-card');
  const scene  = card.parentElement;
  const hint   = document.getElementById('flip-hint');
  const willReveal = !card.classList.contains('flipped');

  // 1. 建立關燈遮罩
  const overlay = document.createElement('div');
  overlay.id = 'dim-overlay';
  document.body.appendChild(overlay);

  // 觸發 transition（double rAF 確保初始 opacity:0 已渲染）
  requestAnimationFrame(() => requestAnimationFrame(() => {
    overlay.classList.add('lights-off');
  }));

  // 2. 關燈後：瞬間翻卡
  setTimeout(() => {
    card.style.transition = 'none';
    card.classList.toggle('flipped');
    card.offsetHeight; // force reflow
    card.style.transition = '';

    // 3. 開燈
    overlay.classList.remove('lights-off');

    setTimeout(() => {
      overlay.remove();
      _flipping = false;

      // 4. 揭曉時：星星 + 光澤 + 卡片發光
      if (willReveal) {
        spawnSparkles();
        addShimmerToCard();
        scene.classList.add('glow');
        setTimeout(() => scene.classList.remove('glow'), 600);
      }

      hint.textContent = card.classList.contains('flipped')
        ? '✨ 再點一次翻回去'
        : '👆 點擊卡片揭曉結果';
    }, 420);
  }, 400);
}

function spawnSparkles() {
  const card = document.getElementById('flip-card');
  const rect = card.getBoundingClientRect();
  const cx = rect.left + rect.width  / 2;
  const cy = rect.top  + rect.height / 2;

  const chars = ['✨','⭐','💫','🌟','✦','★','·','✶'];
  const count = 26;

  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.className = 'sparkle-p';

    const angle = Math.random() * Math.PI * 2;
    const dist  = 70 + Math.random() * 220;
    const tx    = Math.cos(angle) * dist;
    const ty    = Math.sin(angle) * dist;
    const rot   = (Math.random() - 0.5) * 720;
    const size  = 10 + Math.random() * 18;
    const delay = (Math.random() * 180).toFixed(0);
    const dur   = (700 + Math.random() * 350).toFixed(0);

    el.textContent = chars[Math.floor(Math.random() * chars.length)];
    el.style.cssText = `
      left:${cx}px; top:${cy}px;
      font-size:${size}px;
      --tx:${tx}px; --ty:${ty}px;
      --rot:${rot}deg;
      --dur:${dur}ms;
      --delay:${delay}ms;
    `;

    document.body.appendChild(el);
    setTimeout(() => el.remove(), parseInt(dur) + parseInt(delay) + 100);
  }
}

function addShimmerToCard() {
  const cardBack = document.getElementById('card-back');

  shimmer.className = 'card-shimmer';

async function buildBreedStats() {
  const container = document.getElementById('breed-stats');
  const breed     = state.breedData;
  const breedId   = state.answers.breed;
  if (!breed || !breedId) return;

  container.innerHTML = `<div class="breed-stats-card"><div class="breed-stats-loading">🐾 載入同品種資料中...</div></div>`;

  let allSubs = [];
  try { allSubs = await loadSubmissions(); } catch(e) {}

  const breedSubs = allSubs.filter(s => s.breed === breedId);
  const n = breedSubs.length;

  if (n === 0) {
    container.innerHTML = `
      <div class="breed-stats-card">
        <div class="breed-stats-title">${breed.emoji} ${breed.name} 的平均個性</div>
        <div class="breed-stats-sub">你是第一位 ${breed.name} 主人填答！<br>邀請更多同好，就能看到品種平均 🐾</div>
      </div>`;
    return;
  }

  const exMap       = { none:1, pee:2, walk:3, run:4 };
  const foodMap     = { picky:1, normal:2, hungry:3, vacuum:4 };
  const vocalMap    = { silent:1, rarely:2, moderate:3, loud:4 };
  const strangerMap = { hide:1, ignore:2, wag:3, jump:4 };
  const sleepMap    = { always_sleep:1, routine:2, pushy:3, always_awake:4 };
  const sepMap      = { ok:1, bark_lil:2, dramatic:3 };

  const avg = (arr) => (arr.reduce((a,b)=>a+b,0) / arr.length);

  const stats = [
    { emoji:'🏃', label:'運動量', val: avg(breedSubs.map(s=>exMap[s.exercise]||2)),       max:4 },
    { emoji:'🍖', label:'食量',   val: avg(breedSubs.map(s=>foodMap[s.food]||2)),         max:4 },
    { emoji:'🔊', label:'話嘮',   val: avg(breedSubs.map(s=>vocalMap[s.vocal]||2)),       max:4 },
    { emoji:'👥', label:'社交力', val: avg(breedSubs.map(s=>strangerMap[s.stranger]||2)), max:4 },
    { emoji:'😴', label:'愛睡覺', val: avg(breedSubs.map(s=>sleepMap[s.sleep]||2)),       max:4 },
    { emoji:'💔', label:'分離焦慮',val: avg(breedSubs.map(s=>sepMap[s.separation]||2)),   max:3 },
  ];

  // MBTI top type
  const mbtiCounts = {};
  breedSubs.forEach(s => { if(s.mbti) mbtiCounts[s.mbti] = (mbtiCounts[s.mbti]||0)+1; });
  const topEntry = Object.entries(mbtiCounts).sort((a,b)=>b[1]-a[1])[0];
  const topType  = topEntry ? MBTI_TYPES[topEntry[0]] : null;
  const topPct   = topEntry ? Math.round(topEntry[1]/n*100) : 0;

  const barHTML = stats.map(s => {
    const pct = Math.round(s.val / s.max * 100);
    return `
      <div class="stat-row">
        <div class="stat-label">${s.emoji} ${s.label}</div>
        <div class="stat-bar-wrap"><div class="stat-bar" data-pct="${pct}"></div></div>
        <div class="stat-val">${s.val.toFixed(1)}</div>
      </div>`;
  }).join('');

  const mbtiHTML = topType ? `
    <div class="breed-top-mbti">
      最常見性格<br>
      <strong style="color:var(--orange);font-size:15px;">${topEntry[0]} ${topType.name}</strong>
      <span style="font-size:11px;"> (${topPct}%)</span>
    </div>` : '';

  container.innerHTML = `
    <div class="breed-stats-card">
      <div class="breed-stats-title">${breed.emoji} ${breed.name} 的平均個性</div>
      <div class="breed-stats-sub">共 ${n} 份填答資料</div>
      ${barHTML}
      ${mbtiHTML}
    </div>`;

  // 觸發 bar 動畫（設 width 後 transition 才會生效）
  requestAnimationFrame(() => {
    container.querySelectorAll('.stat-bar').forEach(bar => {
      bar.style.width = bar.dataset.pct + '%';
    });
  });
}

  // Aggregate by breed
  const breedStats = {};
  submissions.forEach(s => {
    const id = s.breed;
    if (!id || id === 'unknown') return;
    if (!breedStats[id]) {
      // Look up name/emoji from BREEDS data
      let name = s.breedName, emoji = s.breedEmoji || '🐾';
      if (!name) {
        for (const sz of ['small','medium','large']) {
          const found = BREEDS[sz].find(b => b.id === id);
          if (found) { name = found.name; emoji = found.emoji; break; }
        }
      }
      breedStats[id] = { exercise:0, food:0, vocal:0, social:0, cling:0, n:0, name, emoji };
    }
    const cur = breedStats[id];
    const newN = cur.n + 1;
    cur.exercise = ((cur.exercise * cur.n) + (exMap[s.exercise] || 2)) / newN;
    cur.food     = ((cur.food     * cur.n) + (foodMap[s.food]   || 2)) / newN;
    cur.vocal    = ((cur.vocal    * cur.n) + (vocalMap[s.vocal]  || 2)) / newN;
    cur.social   = ((cur.social   * cur.n) + (strangerMap[s.stranger] || 2)) / newN;
    cur.cling    = ((cur.cling    * cur.n) + (sepMap[s.separation]    || 2)) / newN;
    cur.n = newN;
  });

  const entries = Object.entries(breedStats).filter(([,d]) => d.name && d.n >= 1);

  buildRankTab('tab-exercise', entries, 'exercise', '🏃 最愛運動排行', `運動量指數（1-4 分）．共 ${total} 份問卷`, 4);
  buildRankTab('tab-food',     entries, 'food',     '🍖 最能吃排行',   `食量指數（1-4 分）．共 ${total} 份問卷`, 4);
  buildRankTab('tab-vocal',    entries, 'vocal',    '🔊 最話嘮排行',   `叫聲指數（1-4 分）．共 ${total} 份問卷`, 4);
  buildRankTab('tab-social',   entries, 'social',   '👥 最社交排行',   `陌生人熱情指數（1-4 分）．共 ${total} 份問卷`, 4);
  buildRankTab('tab-cling',    entries, 'cling',    '💔 分離焦慮排行', `分離焦慮指數（1-3 分）．共 ${total} 份問卷`, 3);
  buildBreedList(submissions);
}

function buildRankTab(tabId, entries, field, title, subtitle, maxScore) {
  const sorted = [...entries].sort((a,b) => b[1][field] - a[1][field]).slice(0, 10);

  const emptyState = `
    <div style="text-align:center;padding:32px 16px;">
      <div style="font-size:48px;margin-bottom:12px;">🐾</div>
      <div style="font-size:15px;font-weight:700;color:var(--dark);margin-bottom:6px;">還沒有資料</div>
      <div style="font-size:13px;color:var(--brown);line-height:1.7;">邀請更多毛孩主人填問卷，<br>排行榜就會出現啦！</div>
    </div>
  `;

  const medals = ['🥇','🥈','🥉'];

  const items = sorted.map(([id, d], i) => {
    const val = d[field];
    const pct = Math.round(val / maxScore * 100);
    const medal = i < 3 ? medals[i] : `${i+1}`;
    const posClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
    return `
      <div class="rank-item">
        <span class="rank-pos ${posClass}">${medal}</span>
        <div class="rank-breed-info">
          <div class="rank-breed-name">${d.emoji || '🐾'} ${d.name || id}</div>
          <div class="rank-breed-sub">${d.n} 份</div>
        </div>
        <div class="rank-bar-wrap">
          <div class="rank-bar" style="width:${pct}%">
            <span class="rank-bar-val">${val.toFixed(1)}</span>
          </div>
        </div>
      </div>
    `;
  }).join('');

  document.getElementById(tabId).innerHTML = `
    <div class="rank-card">
      <div class="rank-card-title">${title}</div>
      <div style="font-size:12px;color:var(--brown);margin-bottom:14px;">${subtitle}</div>
      ${sorted.length > 0 ? items : emptyState}
    </div>
  `;
}

function buildBreedList(submissions) {
  const exMap       = { none:1, pee:2, walk:3, run:4 };
  const foodMap     = { picky:1, normal:2, hungry:3, vacuum:4 };
  const vocalMap    = { silent:1, rarely:2, moderate:3, loud:4 };
  const strangerMap = { hide:1, ignore:2, wag:3, jump:4 };
  const sleepMap    = { always_sleep:1, pushy:2, routine:3, always_awake:4 };
  const sepMap      = { ok:1, bark_lil:2, dramatic:3 };
  const avg         = arr => arr.reduce((a,b)=>a+b,0) / arr.length;

  // 彙整各品種
  const breedMap = {};
  submissions.forEach(s => {
    const id = s.breed;
    if (!id || id === 'unknown') return;
    if (!breedMap[id]) {
      let name = s.breedName, emoji = s.breedEmoji || '🐾';
      if (!name) {
        for (const sz of ['small','medium','large']) {
          const f = BREEDS[sz].find(b => b.id === id);
          if (f) { name = f.name; emoji = f.emoji; break; }
        }
      }
      breedMap[id] = { name, emoji, subs: [] };
    }
    breedMap[id].subs.push(s);
  });

  const breeds = Object.entries(breedMap)
    .filter(([,d]) => d.name)
    .sort((a,b) => b[1].subs.length - a[1].subs.length);

  if (breeds.length === 0) {
    document.getElementById('tab-mbti').innerHTML = `
      <div class="rank-card">
        <div class="rank-card-title">🐾 各品種個性總覽</div>
        <div style="text-align:center;padding:32px 16px;">
          <div style="font-size:48px;margin-bottom:12px;">🐾</div>
          <div style="font-size:15px;font-weight:700;color:var(--dark);margin-bottom:6px;">還沒有資料</div>
          <div style="font-size:13px;color:var(--brown);line-height:1.7;">邀請毛孩主人填問卷，<br>品種個性就會出現啦！</div>
        </div>
      </div>`;
    return;
  }

  const accItems = breeds.map(([id, d]) => {
    const subs = d.subs;
    const n    = subs.length;

    const stats = [
      { emoji:'🏃', label:'運動量',   val: avg(subs.map(s=>exMap[s.exercise]||2)),       max:4 },
      { emoji:'🍖', label:'食量',     val: avg(subs.map(s=>foodMap[s.food]||2)),         max:4 },
      { emoji:'🔊', label:'話嘮',     val: avg(subs.map(s=>vocalMap[s.vocal]||2)),       max:4 },
      { emoji:'👥', label:'社交力',   val: avg(subs.map(s=>strangerMap[s.stranger]||2)), max:4 },
      { emoji:'😴', label:'愛睡覺',   val: avg(subs.map(s=>sleepMap[s.sleep]||2)),       max:4 },
      { emoji:'💔', label:'分離焦慮', val: avg(subs.map(s=>sepMap[s.separation]||2)),    max:3 },
    ];

    const mbtiCounts = {};
    subs.forEach(s => { if(s.mbti) mbtiCounts[s.mbti] = (mbtiCounts[s.mbti]||0)+1; });
    const topEntry = Object.entries(mbtiCounts).sort((a,b)=>b[1]-a[1])[0];
    const topType  = topEntry ? MBTI_TYPES[topEntry[0]] : null;
    const topPct   = topEntry ? Math.round(topEntry[1]/n*100) : 0;

    const statsHTML = stats.map(s => {
      const pct = Math.round(s.val / s.max * 100);
      return `
        <div class="stat-row">
          <div class="stat-label">${s.emoji} ${s.label}</div>
          <div class="stat-bar-wrap"><div class="stat-bar" style="width:${pct}%"></div></div>
          <div class="stat-val">${s.val.toFixed(1)}</div>
        </div>`;
    }).join('');

    const mbtiHTML = topType ? `
      <div class="breed-top-mbti" style="margin-top:10px;">
        最常見性格：<strong style="color:var(--orange)">${topEntry[0]} ${topType.name}</strong>（${topPct}%）
      </div>` : '';

    return `
      <div class="breed-acc-item" id="acc-${id}">
        <div class="breed-acc-header" onclick="toggleBreedAcc('${id}')">
          <span class="breed-acc-emoji">${d.emoji}</span>
          <span class="breed-acc-name">${d.name}</span>
          <span class="breed-acc-count">${n} 份</span>
          <span class="breed-acc-arrow">▼</span>
        </div>
        <div class="breed-acc-body">
          <div class="breed-acc-inner">
            ${statsHTML}
            ${mbtiHTML}
          </div>
        </div>
      </div>`;
  }).join('');

  document.getElementById('tab-mbti').innerHTML = `
    <div class="rank-card">
      <div class="rank-card-title">🐾 各品種個性總覽</div>
      <div style="font-size:12px;color:var(--brown);margin-bottom:14px;">
        點選品種查看平均個性 · 共 ${submissions.length} 份問卷 · ${breeds.length} 個品種
      </div>
      <div class="breed-list">${accItems}</div>
    </div>`;
}

function toggleBreedAcc(id) {
  document.getElementById('acc-' + id).classList.toggle('open');
}

  // Delayed bar animation on ranking screen
});
